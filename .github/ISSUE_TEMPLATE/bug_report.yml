name: Bug report
description: Report reproducible unexpected behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here; use SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest configuration and commands that reproduce the issue. Remove secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Valkyr version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include OS, Rust version, transport, and sanitized logs.
