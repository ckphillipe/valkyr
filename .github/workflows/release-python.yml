name: Release Python SDK

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: Publish the validated package to TestPyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # Required for trusted publishing to PyPI.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/p/valkyr' || 'https://test.pypi.org/project/valkyr' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build distribution
        run: |
          cd valkyr-python
          python -m build
      - name: Test distribution
        run: |
          cd valkyr-python
          python -m twine check --strict dist/*
          wheel_venv="${RUNNER_TEMP}/valkyr-release-wheel-venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --upgrade pip
          "$wheel_venv/bin/python" -m pip install --force-reinstall --no-deps dist/*.whl
          "$wheel_venv/bin/python" -c "from importlib.metadata import metadata, version; import valkyr; assert metadata('valkyr')['Name'] == 'valkyr'; assert version('valkyr') == '0.1.0'; assert valkyr.__version__ == '0.1.0'"
      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: valkyr-python/dist
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: valkyr-python/dist
