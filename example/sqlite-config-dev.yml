#     key_pattern: "*"
#     query: |
#       SELECT api_key AS key, auth_value AS value,
#              '/__auth' AS namespace
#       FROM auth_registry
#     frequency: "0 */5 * * * *"
#     description: "Publish authentication records every five minutes"
#     run_on_startup: true

#   # Periodically publishes every persisted /example::context value.
