queries:
  # auth_registry_lookup:
  #   namespace_pattern: "/__auth"
  #   key_pattern: "{api_key}"
  #   query: |
  #     SELECT auth_value AS value
  #     FROM auth_registry
  #     WHERE api_key = ?
  #     LIMIT 1
  #   parameters: [key]
  #   description: "Authoritative API-key lookup"
  #   timeout_seconds: 5

  # security_key_lookup:
  #   namespace_pattern: "/__secrets"
  #   key_pattern: "{base_scope}"
  #   query: |
  #     INSERT INTO security_keys (base_scope, key_bytes, created)
  #     VALUES (?, randomblob(32), CAST(strftime('%s', 'now') AS INTEGER))
  #     ON CONFLICT(base_scope) DO UPDATE SET base_scope = excluded.base_scope
  #     RETURNING '{"key":"' || lower(hex(key_bytes)) || '","created":' || created || '}' AS value
  #   parameters: [key]
  #   description: "Atomic encryption-key lookup/create; back up security.db"
  #   timeout_seconds: 5

  # Queries register their namespace/key patterns with PROVIDE automatically.
  example_state_provider:
    namespace_pattern: "/example"
    key_pattern: "{key}"
    query: |
      SELECT state_value AS value
      FROM example_state
      WHERE context = ? AND state_key = ?
      LIMIT 1
    parameters: [context, key]
    description: "Context-aware on-demand provider for /example::context"
    timeout_seconds: 5
    provider_wait_timeout: "500ms"

stores:
  # auth_registry:
  #   namespace_pattern: "/__auth"
  #   key_pattern: "{api_key}"
  #   set_query: |
  #     INSERT INTO auth_registry (api_key, auth_value)
  #     VALUES (?, ?)
  #     ON CONFLICT(api_key) DO UPDATE SET auth_value = excluded.auth_value
  #   set_parameters: [key, value]
  #   # Valkyr denies exact /__auth deletes, but the adapter configuration
  #   # requires a delete statement for its STORE contract.
  #   delete_query: "DELETE FROM auth_registry WHERE api_key = ?"
  #   delete_parameters: [key_pattern]
  #   timeout_seconds: 5

  example_state:
    namespace_pattern: "/example"
    key_pattern: "{key}"
    set_query: |
      INSERT INTO example_state (context, state_key, state_value)
      VALUES (?, ?, ?)
      ON CONFLICT(context, state_key) DO UPDATE SET state_value = excluded.state_value
    set_parameters: [context, key, value]
    delete_query: "DELETE FROM example_state WHERE context = ? AND state_key = ?"
    delete_parameters: [context, key_pattern]
    timeout_seconds: 5
