# SQLite adapter example for Valkyr's reserved authentication and encryption-key
# namespaces.
# SQLite protects this file through filesystem permissions. Store only the
# complete JSON auth record in auth_value and back up security.db.
database:
  # mode=rwc creates security.db when it does not already exist.
  url: "sqlite://example/runtime/example.db?mode=rwc"
  max_connections: 2
  connection_timeout_seconds: 30
  query_timeout_seconds: 60

valkyr:
  endpoints:
    - url: tcp://127.0.0.1:8081
      # Relative to this adapter config; local setup mounts this file.
      # Use a dedicated adapter key provisioned through /__auth in production.
      api_key_file: ./bootstrap-api-key
  request_timeout: "5s"
  provider_wait_timeout: "250ms"
  miss_cache_ttl: "30s"
  max_retries: 9

logging:
  level: info
  format: pretty # use json for newline-delimited structured logs
  target: false
  thread_names: false
  ansi: true

init:
  # - name: create_auth_registry
  #   sql: |
  #     CREATE TABLE IF NOT EXISTS auth_registry (
  #       api_key TEXT PRIMARY KEY,
  #       auth_value TEXT NOT NULL
  #     )
  # - name: create_security_keys
  #   sql: |
  #     CREATE TABLE IF NOT EXISTS security_keys (
  #       base_scope TEXT NOT NULL PRIMARY KEY,
  #       key_bytes BLOB NOT NULL CHECK(length(key_bytes) = 32),
  #       created INTEGER NOT NULL
  #     )
  - name: create_example_state
    sql: |
      CREATE TABLE IF NOT EXISTS example_state (
        context TEXT NOT NULL,
        state_key TEXT NOT NULL,
        state_value TEXT NOT NULL,
        PRIMARY KEY (context, state_key)
      )

# providers:
#   # Publishes complete records so Valkyr can warm its auth cache.
#   auth_registry_publisher:
